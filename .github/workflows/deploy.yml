name: "Build & Deploy — Bourse"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Passer les tests (skip)'
        type: boolean
        default: false
      build_apk:
        description: 'Construire un nouvel APK Android (consomme quota EAS)'
        type: boolean
        default: false
      deploy_keycloak:
        description: 'Forcer le rebuild et déploiement de l image Keycloak bourse'
        type: boolean
        default: false

env:
  # Secrets à configurer dans Settings → Secrets → Actions du repo GitHub :
  #   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
  #   ACR_LOGIN_SERVER, EXPO_TOKEN
  ACR: ${{ secrets.ACR_LOGIN_SERVER }}
  NS:  bourse
  RG:  rg-cfc-dev
  AKS: aks-bourse-prod

jobs:
  # ── Détection des fichiers modifiés ────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:   ${{ steps.f.outputs.backend }}
      db_migrations: ${{ steps.f.outputs.db_migrations }}
      frontend:  ${{ steps.f.outputs.frontend }}
      admin:     ${{ steps.f.outputs.admin }}
      keycloak:  ${{ steps.f.outputs.keycloak }}
      kafka:     ${{ steps.f.outputs.kafka }}
      bvc_relay: ${{ steps.f.outputs.bvc_relay }}
      mobile_native: ${{ steps.f.outputs.mobile_native }}
      mobile_js:     ${{ steps.f.outputs.mobile_js }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
            # Distinct de "backend" : ne déclenche l'exécution des migrations
            # que si un fichier SQL change (schéma initial ou delta).
            db_migrations:
              - 'db/init.sql'
              - 'db/migrations/**'
            frontend:
              - 'frontend/**'
            admin:
              - 'admin/**'
            keycloak:
              - 'keycloak/**'
            kafka:
              - 'kafka/**'
            bvc_relay:
              - 'serve.py'
            # Code natif → nouveau APK obligatoire
            mobile_native:
              - 'mobile/android/**'
              - 'mobile/ios/**'
              - 'mobile/eas.json'
              - 'mobile/app.json'
              - 'mobile/package.json'
              - 'mobile/package-lock.json'
            # Code JS/UI → OTA update suffit
            mobile_js:
              - 'mobile/app/**'
              - 'mobile/src/**'
              - 'mobile/screens/**'
              - 'mobile/hooks/**'
              - 'mobile/services/**'
              - 'mobile/constants/**'
              - 'mobile/assets/**'
              - 'mobile/App.tsx'

  # ── Build + Push + Deploy ──────────────────────────────────────────────────
  deploy:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend   == 'true' ||
      needs.changes.outputs.db_migrations == 'true' ||
      needs.changes.outputs.frontend  == 'true' ||
      needs.changes.outputs.admin     == 'true' ||
      needs.changes.outputs.keycloak  == 'true' ||
      needs.changes.outputs.kafka     == 'true' ||
      needs.changes.outputs.bvc_relay == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name $(echo "$ACR" | cut -d. -f1)

      # ── Builds conditionnels ────────────────────────────────────────────────
      # workflow_dispatch force le build de toutes les images (premier déploiement
      # ou re-déploiement complet). Sur push, seules les images modifiées sont buildées.
      - name: Build & push backend
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker build \
            -t $ACR/bourse-backend:${{ github.sha }} \
            -t $ACR/bourse-backend:latest \
            ./backend
          docker push $ACR/bourse-backend:${{ github.sha }}
          docker push $ACR/bourse-backend:latest

      - name: Build & push frontend
        if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker build \
            -t $ACR/bourse-frontend:${{ github.sha }} \
            -t $ACR/bourse-frontend:latest \
            ./frontend
          docker push $ACR/bourse-frontend:${{ github.sha }}
          docker push $ACR/bourse-frontend:latest

      - name: Build & push admin
        if: needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker build \
            -t $ACR/bourse-admin-frontend:${{ github.sha }} \
            -t $ACR/bourse-admin-frontend:latest \
            ./admin
          docker push $ACR/bourse-admin-frontend:${{ github.sha }}
          docker push $ACR/bourse-admin-frontend:latest

      - name: Build & push keycloak
        if: needs.changes.outputs.keycloak == 'true' || inputs.deploy_keycloak == true || github.event_name == 'workflow_dispatch'
        run: |
          docker build \
            -t $ACR/bourse-keycloak:${{ github.sha }} \
            -t $ACR/bourse-keycloak:latest \
            ./keycloak
          docker push $ACR/bourse-keycloak:${{ github.sha }}
          docker push $ACR/bourse-keycloak:latest

      - name: Build & push BVC producer
        if: needs.changes.outputs.kafka == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker build \
            -t $ACR/bourse-bvc-producer:${{ github.sha }} \
            -t $ACR/bourse-bvc-producer:latest \
            ./kafka
          docker push $ACR/bourse-bvc-producer:${{ github.sha }}
          docker push $ACR/bourse-bvc-producer:latest

      - name: Build & push BVC relay
        if: needs.changes.outputs.bvc_relay == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker build \
            -t $ACR/bourse-bvc-relay:${{ github.sha }} \
            -t $ACR/bourse-bvc-relay:latest \
            -f Dockerfile.bvc-relay .
          docker push $ACR/bourse-bvc-relay:${{ github.sha }}
          docker push $ACR/bourse-bvc-relay:latest

      # ── Déploiement AKS ─────────────────────────────────────────────────────
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $RG \
            --name $AKS \
            --admin \
            --overwrite-existing

      # Helm upgrade --install : gère l'installation initiale ET les mises à jour.
      # Passe les secrets et la config Azure PostgreSQL au chart.
      # --timeout 10m : Kafka + Keycloak peuvent prendre plusieurs minutes au 1er démarrage.
      - name: Helm upgrade --install
        run: |
          helm upgrade --install bourse-platform ./infra/helm/bourse-platform \
            --namespace $NS --create-namespace \
            --set image.backend.repository=$ACR/bourse-backend \
            --set image.frontend.repository=$ACR/bourse-frontend \
            --set image.adminFrontend.repository=$ACR/bourse-admin-frontend \
            --set image.bvcProducer.repository=$ACR/bourse-bvc-producer \
            --set image.bvcRelay.repository=$ACR/bourse-bvc-relay \
            --set image.keycloak.repository=$ACR/bourse-keycloak \
            --set postgres.host=psql-bourse-prod.postgres.database.azure.com \
            --set postgres.password="${{ secrets.TF_VAR_POSTGRES_ADMIN_PASSWORD }}" \
            --set secrets.kcAdminPassword="${{ secrets.KC_STAGING_ADMIN_PASSWORD }}" \
            --timeout 20m

      # Crée le topic Kafka market.prices s'il n'existe pas déjà (idempotent).
      # Séparé du chart Helm pour éviter que le Job de provisioning bloque le timeout.
      - name: Créer topics Kafka
        continue-on-error: true
        run: |
          KAFKA_POD=$(kubectl get pod -n $NS -l app.kubernetes.io/name=kafka -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -z "$KAFKA_POD" ]; then
            echo "::warning::Pod Kafka introuvable — topic non créé (relancer le workflow pour réessayer)"
          else
            echo "Pod Kafka: $KAFKA_POD — attente Ready (max 8min)..."
            kubectl wait pod/$KAFKA_POD -n $NS --for=condition=Ready --timeout=480s
            kubectl exec -n $NS $KAFKA_POD -- kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --create --if-not-exists \
              --topic market.prices \
              --partitions 3 \
              --replication-factor 1
            echo "Topic market.prices OK"
          fi

      # Migration DB via un pod temporaire postgres dans le cluster (accès VNet privé).
      # 1) Applique db/init.sql si le schéma "ordres" n'existe pas encore (1ère install).
      # 2) Applique ensuite les migrations delta db/migrations/*.sql (idempotentes).
      - name: Appliquer les migrations DB
        if: needs.changes.outputs.db_migrations == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PGPASSWORD: ${{ secrets.TF_VAR_POSTGRES_ADMIN_PASSWORD }}
        run: |
          PG_ARGS="-h psql-bourse-prod.postgres.database.azure.com -U bourse_admin -d bourse_db"

          kubectl run migration-runner --restart=Never \
            --namespace $NS --image=postgres:16-alpine \
            --env="PGPASSWORD=$PGPASSWORD" \
            --command -- sleep 300 || true
          kubectl wait pod/migration-runner -n $NS --for=condition=Ready --timeout=60s

          # Schéma initial : appliqué uniquement si "ordres" n'existe pas encore.
          # grep -v filtre la ligne "CREATE DATABASE keycloak_db" (gérée par Terraform).
          SCHEMA_EXISTS=$(kubectl exec -n $NS migration-runner -- \
            psql $PG_ARGS -tAq -c "SELECT COUNT(*) FROM pg_namespace WHERE nspname = 'ordres'")
          if [ "$SCHEMA_EXISTS" = "0" ]; then
            echo "Schéma 'ordres' absent — application de db/init.sql..."
            kubectl cp "db/init.sql" "$NS/migration-runner:/tmp/init.sql"
            kubectl exec -n $NS migration-runner -- sh -c \
              "grep -v 'CREATE DATABASE' /tmp/init.sql | psql $PG_ARGS -v ON_ERROR_STOP=1 -f -"
          else
            echo "Schéma 'ordres' déjà présent — skip init.sql"
          fi

          # Migrations delta
          for f in db/migrations/*.sql; do
            nom=$(basename "$f")
            echo "── Migration delta : $nom ──"
            kubectl cp "$f" "$NS/migration-runner:/tmp/$nom"
            kubectl exec -n $NS migration-runner -- psql $PG_ARGS \
              -v ON_ERROR_STOP=1 -f "/tmp/$nom"
          done

          kubectl delete pod migration-runner -n $NS --ignore-not-found

      - name: Health check backend
        if: needs.changes.outputs.backend == 'true'
        continue-on-error: true
        run: |
          echo "Attente stabilisation du pod (20s)..."
          sleep 20
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 10 https://api.cfconsultancy.org/api/health; then
              echo "Health check backend OK"
              exit 0
            fi
            echo "Tentative $i échouée, nouvel essai dans 10s..."
            sleep 10
          done
          echo "::warning::Health check backend non confirmé — vérifiez manuellement."

      - name: Health check frontend
        if: needs.changes.outputs.frontend == 'true'
        continue-on-error: true
        run: |
          sleep 10
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 10 https://bourse.cfconsultancy.org/; then
              echo "Health check frontend OK"
              exit 0
            fi
            echo "Tentative $i échouée, nouvel essai dans 10s..."
            sleep 10
          done
          echo "::warning::Health check frontend non confirmé — vérifiez manuellement."

  # ── Tests fonctionnels E2E (Selenium) ────────────────────────────────────────
  # Exécutés après le déploiement réussi, contre la production.
  # Créent un compte bourse réel → vérifient tout le flux utilisateur.
  tests-fonctionnels:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-fonctionnels.txt

      - name: Installer les dépendances (Selenium + pytest)
        working-directory: backend
        run: pip install -r requirements-fonctionnels.txt

      - name: Installer Chrome
        uses: browser-actions/setup-chrome@v1

      # Job séparé de "deploy" => runner différent => aucune session Azure/
      # kubectl héritée : on ré-authentifie ici avec la même identité de
      # service (secrets OIDC déjà configurés sur ce repo), pour que
      # FixTracer (backend/tests/fix_trace.py) puisse lire les vrais logs
      # [FIX OUT]/[FIX IN] du pod backend de PRODUCTION via `kubectl logs`,
      # exactement comme demo_fix_flow.py le fait en local via `docker logs`.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $RG \
            --name $AKS \
            --admin \
            --overwrite-existing

      - name: Tests fonctionnels bourse (Selenium E2E)
        working-directory: backend
        env:
          BOURSE_BASE_URL: https://bourse.cfconsultancy.org
          PYTHONPATH: .
          FIX_TRACE_K8S_NAMESPACE: bourse
          FIX_TRACE_K8S_SELECTOR: app.kubernetes.io/component=backend
        run: |
          set -o pipefail
          # -s : desactive la capture pytest, indispensable pour voir les
          # traces FIX decodees (print() dans _FixTracer.tracer_et_verifier)
          # dans le rapport, meme quand le test reussit (par defaut pytest
          # n'affiche les print() captures qu'en cas d'echec).
          pytest tests/fonctionnels/ -v -s --tb=short 2>&1 | tee fonctionnels-report.txt

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fonctionnels-report-bourse
          path: backend/fonctionnels-report.txt
          retention-days: 7

  # ── Mobile natif : nouveau APK — déclenchement MANUEL uniquement ─────────────
  # GitHub Actions → Run workflow → cocher "Construire un nouvel APK"
  # Quota EAS Free = 15 builds Android/mois — ne pas déclencher sur push.
  build-mobile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: EAS Build — Android APK (preview)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive

  # ── Mobile JS : OTA update via EAS Update ─────────────────────────────────
  # Changements JS/UI uniquement → OTA update (pas besoin de nouvel APK).
  # Si le natif a changé, build-mobile prend le relai — pas d'OTA inutile.
  update-mobile:
    needs: changes
    if: needs.changes.outputs.mobile_js == 'true' && needs.changes.outputs.mobile_native != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: EAS Update — OTA push
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://api.cfconsultancy.org
          EXPO_PUBLIC_KEYCLOAK_URL: https://auth.cfconsultancy.org
          EXPO_PUBLIC_KEYCLOAK_REALM: bourse-en-ligne
          EXPO_PUBLIC_KEYCLOAK_CLIENT_ID: mobile-app
          EXPO_PUBLIC_BANQUE_DASHBOARD_URL: https://banquedigitale.cfconsultancy.org
          EXPO_PUBLIC_MARKET_OPEN_HOUR: "9"
          EXPO_PUBLIC_MARKET_CLOSE_HOUR: "15"
          EXPO_PUBLIC_MARKET_CLOSE_MIN: "30"
        run: |
          eas update \
            --channel production \
            --message "Deploy ${{ github.sha }}" \
            --non-interactive
